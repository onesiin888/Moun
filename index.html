<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강희창과 함께하는 반도체 로드</title>
    <meta property="og:title" content="강희창과 함께하는 반도체 로드">
    <meta property="og:description" content="글로벌 AI 반도체 핵심 종목 분석 · 실시간 라이브 시세 연동">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.25); }
        .glow-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .glow-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.3); border-color: rgba(6, 182, 212, 0.6); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-subtle { animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes highlight-flash { 0% { border-color: #06b6d4; box-shadow: 0 0 25px #06b6d4; } 100% { border-color: #374151; box-shadow: none; } }
        .highlight-target { animation: highlight-flash 1.5s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">

                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">

                        <span id="live-status-badge" class="text-xs px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800/50 font-normal">시세 동기화 중...</span>
